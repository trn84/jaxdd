[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxdd"
version = "0.0.1"
description = "A batched 1D drift-diffusion solver in JAX, after SIMsalabim"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-only" }
dependencies = ["jax>=0.4.30", "numpy>=2.0"]

[project.optional-dependencies]
#: pytest-xdist: the tests in parallel, one worker per physical core (tests/conftest.py)
dev = ["pytest>=8.0", "pytest-xdist[psutil]>=3.5", "ruff>=0.5", "scipy>=1.11"]  # scipy: validation/fit.py
#: benchmarks/plot.py
bench = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/jaxdd"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
# In parallel, a worker per physical core (pytest-xdist); `-n 0` runs them in one process.
addopts = "-n auto --dist worksteal"
